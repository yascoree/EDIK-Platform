spring.application.name=api-gateway

# Port de la Gateway
server.port=8080

# Route vers document-service
spring.cloud.gateway.server.webflux.routes[0].id=document-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://document-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/documents/**

# Endpoint de vérification de l'état
management.endpoints.web.exposure.include=health